<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Burnout Assessment{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    h1 { font-size: 1.6rem; }
    fieldset { border: 1px solid #d9e2ec; border-radius: 8px; margin: 1.2rem 0; padding: 1rem; }
    legend { font-weight: 600; padding: 0 .4rem; }
    .q { margin: .8rem 0; }
    .q label { display: block; font-weight: 500; margin-bottom: .35rem; }
    select, input[type=text] { padding: .4rem; border: 1px solid #bcccdc; border-radius: 6px; min-width: 240px; }
    button { background: #2f6fdb; color: white; border: 0; padding: .6rem 1.1rem; border-radius: 6px; cursor: pointer; }
    .notice { background: #fff5e6; border-left: 4px solid #e0a300; padding: .9rem 1rem; border-radius: 4px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #d9e2ec; padding: .5rem; text-align: left; }
    tr.flag { background: #fde8e8; }
    .muted { color: #6b7280; font-size: .9rem; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
