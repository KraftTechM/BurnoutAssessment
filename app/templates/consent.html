{% extends "base.html" %}
{% block content %}
<h1>{{ t('title') }}</h1>

<div class="notice">
  <strong>{{ t('title') }}.</strong> {{ t('consent_text') }}
</div>

<form method="get" action="/survey">
  <input type="hidden" name="lang" value="{{ lang }}">
  <fieldset>
    <legend>{{ t('consent_title') }}</legend>
    <label><input type="checkbox" name="consent" required> {{ t('consent_text') }}</label>
  </fieldset>

  <fieldset>
    <legend>{{ t('team') }}</legend>
    <select name="team" required>
      <option value="">{{ t('select') }}</option>
      {% for tm in teams %}<option value="{{ tm }}">{{ tm }}</option>{% endfor %}
    </select>
  </fieldset>

  <fieldset>
    <legend>{{ t('role') }}</legend>
    <select name="role">
      <option value="">{{ t('prefer_not') }}</option>
      <option>engineer</option>
      <option>coordinator</option>
      <option>cra</option>
      <option>manager</option>
      <option>medical-monitor</option>
      <option>other</option>
    </select>
  </fieldset>

  <button type="submit">{{ t('continue') }}</button>
</form>
{% endblock %}
